name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Skills, links, tests, and hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r requirements-dev.txt

      - name: Validate Agent Skills
        run: python scripts/validate_skills.py --strict

      - name: Check local Markdown links
        run: python scripts/check_links.py

      - name: Run validator regression tests
        run: python -m unittest discover -s tests -v

      - name: Run repository hygiene hooks
        id: hygiene
        continue-on-error: true
        run: |
          set -o pipefail
          pre-commit run --all-files --show-diff-on-failure 2>&1 | tee hygiene.log

      - name: Report hook failure
        if: steps.hygiene.outcome == 'failure'
        run: |
          python - <<'PY'
          from pathlib import Path

          lines = Path("hygiene.log").read_text(encoding="utf-8").splitlines()
          message = "\n".join(lines[-60:]).replace("%", "%25").replace("\r", "")
          print("::error title=hygiene::" + message.replace("\n", "%0A"))
          PY
          exit 1
