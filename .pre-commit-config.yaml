repos:
  # =============================================================================
  # Repository hygiene
  # =============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: fix-byte-order-marker
      - id: end-of-file-fixer
        exclude: ^(AGENTS|CLAUDE)\.md$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(AGENTS|CLAUDE)\.md$
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^(AGENTS|CLAUDE)\.md$
      - id: detect-private-key
  # =============================================================================
  # Secret scanning
  # =============================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
  # IBM detect-secrets adds provider plugins and an audited baseline. The
  # baseline disables keyword scanning and excludes generated dependency files;
  # keep its policy sections aligned with skills/ai-init/files/.secrets.baseline.
  - repo: https://github.com/IBM/detect-secrets
    rev: a3e7998bfa4924b13df3f9cb49070abdbdff8802 # v0.13.1
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline', '--no-keyword-scan']
  # =============================================================================
  # Markdown consistency (frontmatter-aware; does not rewrite YAML)
  # =============================================================================
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10 # v0.23.3
    hooks:
      - id: markdownlint-cli2
  # =============================================================================
  # Agent Skills validation
  # =============================================================================
  - repo: local
    hooks:
      - id: validate-skills
        name: validate Agent Skills frontmatter, metadata, and links
        entry: python scripts/validate_skills.py --strict
        language: python
        additional_dependencies: [PyYAML==6.0.3]
        pass_filenames: false
        files: ^(skills/|evals/)
      - id: check-links
        name: check local Markdown links
        entry: python scripts/check_links.py
        language: python
        additional_dependencies: []
        pass_filenames: false
        files: \.md$
      - id: validator-tests
        name: run validator regression tests
        entry: python -m unittest discover -s tests -v
        language: python
        additional_dependencies: [PyYAML==6.0.3]
        pass_filenames: false
        files: ^(scripts/|tests/)
