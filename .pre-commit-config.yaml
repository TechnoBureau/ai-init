repos:
  # =============================================================================
  # Pinning policy: every remote hook and action uses an exact version tag.
  # Tags are readable and Dependabot can propose updates, but a tag is a
  # mutable reference, so review the release before merging an update.
  # =============================================================================
  # =============================================================================
  # Repository hygiene
  # =============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: fix-byte-order-marker
      - id: end-of-file-fixer
        exclude: ^AGENTS\.md$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^AGENTS\.md$
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^AGENTS\.md$
      - id: detect-private-key
  # =============================================================================
  # Secret scanning
  # =============================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # IBM detect-secrets fork: provider plugins, an audited baseline, and
  # additional-dependency support. The exclude list is the same policy recorded
  # in .secrets.baseline; change both together.
  - repo: https://github.com/IBM/detect-secrets
    rev: 0.13.1+ibm.64.dss
    hooks:
      - id: detect-secrets
        description: Detect and prevent accidental secret commits.
        additional_dependencies:
          - boxsdk<4
          - chardet<7
        args:
          - --baseline
          - .secrets.baseline
          - --use-all-plugins
          - --no-keyword-scan
          - --fail-on-unaudited
        exclude: '(^|/)(requirements[^/]*\.txt|go\.mod|go\.sum|pom\.xml|build\.gradle(\.kts)?|package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb|Cargo\.lock|poetry\.lock|Pipfile\.lock|Gemfile\.lock|composer\.lock|\.secrets\.baseline)$|(^|/)(node_modules|vendor|third_party|dist|build|\.venv|venv|__pycache__)/|\.(min\.js|min\.css|map|lock|sum|snap|drawio)$'
  # =============================================================================
  # Markdown consistency (frontmatter-aware; does not rewrite YAML)
  # =============================================================================
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
  # =============================================================================
  # Agent Skills validation
  # =============================================================================
  - repo: local
    hooks:
      - id: validate-skills
        name: validate Agent Skills frontmatter, metadata, and links
        entry: python scripts/validate_skills.py --strict
        language: python
        additional_dependencies: [PyYAML==6.0.3]
        pass_filenames: false
        files: ^(skills/|evals/)
      - id: check-links
        name: check local Markdown links
        entry: python scripts/check_links.py
        language: python
        additional_dependencies: []
        pass_filenames: false
        files: \.md$
      - id: validator-tests
        name: run validator regression tests
        entry: python -m unittest discover -s tests -v
        language: python
        additional_dependencies: [PyYAML==6.0.3]
        pass_filenames: false
        files: ^(scripts/|tests/)
