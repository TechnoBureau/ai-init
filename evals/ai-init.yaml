skill: ai-init
cases:
  - id: bootstrap-empty-repository
    prompt: >-
      Initialize AI context and baseline documentation for this empty
      repository.
    should_trigger: true
    expected:
      - "Creates README.md plus AGENTS.md and CLAUDE.md relative symlinks or reports an unsupported platform."
      - "Creates docs/PRD.md, docs/structure.md, docs/decisions.md, and docs/security.md through the appropriate skills."
      - "Marks unknown stack, goals, tests, and deployment decisions as Not decided rather than inventing them."
    forbidden:
      - "Inventing product goals, personas, commands, or architecture."
      - "Creating a copied AGENTS.md or CLAUDE.md instead of a symlink."
      - "Creating docs/tests.md without a test-documentation request."

  - id: refresh-existing-documents
    prompt: >-
      Refresh the repository documentation, preserving existing decision IDs
      and the lowercase readme.md content.
    should_trigger: true
    expected:
      - "Inspects source and configuration before trusting existing Markdown."
      - "Migrates readme.md content into uppercase README.md without losing unique instructions."
      - "Preserves D- and FR-IDs and updates documents in place."
      - "Adds document-control fields and evidence provenance."
    forbidden:
      - "Replacing existing documents wholesale."
      - "Leaving two competing README indexes."

  - id: migrate-architecture-filename
    prompt: >-
      Our docs/Architecture.md uses the old mixed-case name. Standardize the
      documentation layout.
    should_trigger: true
    expected:
      - "Migrates to docs/architecture.md using a case-safe rename and updates links."
      - "Preserves the existing content and reports the migration."
    forbidden:
      - "Deleting the old file without preserving its content."

  - id: generate-repository-meta-files
    prompt: >-
      Add the standard repository files to this project: contributing guide,
      code of conduct, security policy, and code owners. We use MIT and the
      maintainers are @acme/platform.
    should_trigger: true
    expected:
      - "Creates CONTRIBUTING.md, CODE_OF_CONDUCT.md, SECURITY.md, and .github/CODEOWNERS from the templates."
      - "Keeps LICENSE consistent with the confirmed MIT licence and does not relicense existing code."
      - "Uses the confirmed owner @acme/platform without inventing additional owners."
      - "Requires a real private contact for the code of conduct and security policy before writing them."
    forbidden:
      - "Inventing an email address, owner handle, or response commitment."
      - "Choosing a different licence because another one looks more convenient."

  - id: do-not-invent-license
    prompt: >-
      Add whatever licence you think is best to this repository.
    should_trigger: true
    expected:
      - "Explains that licence choice is a legal decision for the owner."
      - "Offers options with trade-offs and asks for an explicit choice and copyright holder."
      - "Does not create LICENSE until the choice is confirmed."
    forbidden:
      - "Writing an MIT or Apache licence unprompted."
      - "Stating a copyright holder that the user did not confirm."

  - id: generate-docs-folder
    prompt: >-
      Create the docs directory for this repository with the standard
      documentation set and an index.
    should_trigger: true
    expected:
      - "Creates docs/README.md as the index and only links documents that exist."
      - "Produces each document from the template at the matching path under skills/*/templates/docs/."
      - "Generates PRD, structure, decisions, and security documents through the dedicated skills."
      - "Adds conditional documents only when repository evidence supports them."
    forbidden:
      - "Linking to documents that were skipped."
      - "Creating docs/tests.md without a test request."

  - id: do-not-handle-test-implementation
    prompt: >-
      My unit test for the payment retry handler is failing. Fix it.
    should_trigger: false
    expected:
      - "Routes to the tests skill or performs test work directly."
      - "Does not bootstrap or rewrite repository documentation as a side effect."

  - id: do-not-handle-security-assessment
    prompt: >-
      Review our cryptographic inventory and post-quantum readiness.
    should_trigger: false
    expected:
      - "Routes to the security skill."
      - "Does not produce a generic README instead of the requested assessment."
