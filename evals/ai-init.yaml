skill: ai-init
cases:
  - id: bootstrap-empty-repository
    prompt: >-
      Initialize AI context and baseline documentation for this empty
      repository.
    should_trigger: true
    expected:
      - "Creates README.md plus AGENTS.md and CLAUDE.md relative symlinks or reports an unsupported platform."
      - "Creates docs/PRD.md, docs/structure.md, docs/decisions.md, and docs/security.md through the appropriate skills."
      - "Marks unknown stack, goals, tests, and deployment decisions as Not decided rather than inventing them."
    forbidden:
      - "Inventing product goals, personas, commands, or architecture."
      - "Creating a copied AGENTS.md or CLAUDE.md instead of a symlink."
      - "Creating docs/tests.md without a test-documentation request."

  - id: refresh-existing-documents
    prompt: >-
      Refresh the repository documentation, preserving existing decision IDs
      and the lowercase readme.md content.
    should_trigger: true
    expected:
      - "Inspects source and configuration before trusting existing Markdown."
      - "Migrates readme.md content into uppercase README.md without losing unique instructions."
      - "Preserves D- and FR-IDs and updates documents in place."
      - "Updates claims from the current code without adding document-control fields or provenance headers."
    forbidden:
      - "Replacing existing documents wholesale."
      - "Leaving two competing README indexes."

  - id: migrate-architecture-filename
    prompt: >-
      Our docs/Architecture.md uses the old mixed-case name. Standardize the
      documentation layout.
    should_trigger: true
    expected:
      - "Migrates to docs/architecture.md using a case-safe rename and updates links."
      - "Preserves the existing content and reports the migration."
    forbidden:
      - "Deleting the old file without preserving its content."

  - id: generate-repository-meta-files
    prompt: >-
      Add the standard repository files to this project: contributing guide,
      code of conduct, security policy, and code owners. We use MIT and the
      maintainers are @acme/platform.
    should_trigger: true
    expected:
      - "Creates CONTRIBUTING.md, CODE_OF_CONDUCT.md, SECURITY.md, and .github/CODEOWNERS from the templates."
      - "Keeps LICENSE consistent with the confirmed MIT licence and does not relicense existing code."
      - "Uses the confirmed owner @acme/platform without inventing additional owners."
      - "Requires a real private contact for the code of conduct and security policy before writing them."
    forbidden:
      - "Inventing an email address, owner handle, or response commitment."
      - "Choosing a different licence because another one looks more convenient."

  - id: do-not-invent-license
    prompt: >-
      Add whatever licence you think is best to this repository.
    should_trigger: true
    expected:
      - "Explains that licence choice is a legal decision for the owner."
      - "Offers options with trade-offs and asks for an explicit choice and copyright holder."
      - "Does not create LICENSE until the choice is confirmed."
    forbidden:
      - "Writing an MIT or Apache licence unprompted."
      - "Stating a copyright holder that the user did not confirm."

  - id: generate-docs-folder
    prompt: >-
      Create the docs directory for this repository with the standard
      documentation set and an index.
    should_trigger: true
    expected:
      - "Creates docs/README.md as the index and only links documents that exist."
      - "Produces each document from the template at the matching path under skills/*/templates/docs/."
      - "Generates PRD, structure, decisions, and security documents through the dedicated skills."
      - "Adds conditional documents only when repository evidence supports them."
    forbidden:
      - "Linking to documents that were skipped."
      - "Creating docs/tests.md without a test request."

  - id: merge-gitignore
    prompt: >-
      Add a standard .gitignore for our mixed C, C++, Go, and shell repository,
      and keep the entries we already have.
    should_trigger: true
    expected:
      - "Merges missing sections into the existing .gitignore without deleting or rewriting maintainer entries."
      - "Covers OS metadata, editors, swap and temporary files, secrets, logs, C and C++, Go, and shell."
      - "Checks git ls-files -ci --exclude-standard and reports that no tracked file is ignored."
    forbidden:
      - "Replacing the existing .gitignore wholesale."
      - "Ignoring go.mod, go.sum, Makefile, CMakeLists.txt, source files, or the .github directory."

  - id: configure-detect-secrets
    prompt: >-
      Add IBM detect-secrets to our pre-commit and generate the baseline, but
      skip keyword scanning and the generated dependency files.
    should_trigger: true
    expected:
      - "Creates .secrets.baseline with empty results, no KeywordDetector, and exclusions for lockfiles, dependency manifests, vendor, and build output."
      - "Wires the IBM detect-secrets hook by version tag with --baseline, --use-all-plugins, --no-keyword-scan, and --fail-on-unaudited, plus boxsdk and chardet as additional dependencies."
      - "Verifies that a planted provider-pattern secret fails while an excluded file passes."
    forbidden:
      - "Recording a real secret in the baseline instead of removing and rotating it."
      - "Excluding tests/ or fixtures/ wholesale."
      - "Leaving the baseline version or plugin policy different from the pinned hook."
      - "Pinning the hook by branch or by a raw commit SHA instead of a version tag."

  - id: document-current-state
    prompt: >-
      Document the current state of this repository, including the exact
      tooling versions and the last test results.
    should_trigger: true
    expected:
      - "Describes what exists now and links the configuration that owns each value."
      - "Points to requirements-dev.txt and .pre-commit-config.yaml instead of copying their pins."
    forbidden:
      - "Pasting a dated test log, a commit SHA, or a test count into the document."
      - "Duplicating the versions pinned in requirements-dev.txt or .pre-commit-config.yaml."

  - id: no-bookkeeping-metadata
    prompt: >-
      Record a decision for this repository. Include its status, date, owner,
      evidence, the options we rejected, and what it supersedes.
    should_trigger: true
    expected:
      - "Writes a record with context, decision, consequences, and reason only."
      - "Explains that status, date, owner, evidence, rejected options, and supersession are not recorded because Git and the pull request own them."
    forbidden:
      - "Adding Status, Date, Owner, Evidence, Alternatives rejected, or Supersedes fields to the decision."
      - "Adding an evidence, verification, baseline, target, or owner column to a table as a substitute."

  - id: link-only-what-was-generated
    prompt: >-
      Generate the documentation set for this repository. It has no UI, no task
      board, and no test suite.
    should_trigger: true
    expected:
      - "Writes docs/PRD.md, docs/structure.md, docs/decisions.md, and docs/security.md, and links only those."
      - "Names the skipped documents in prose instead of linking docs/design.md, docs/tests.md, or docs/tasks.md."
      - "Replaces the related-document footer with links to the documents that exist."
    forbidden:
      - "Leaving a hardcoded footer or index row that links a document this run skipped."
      - "Appending the project name to a document title."
    prompt: >-
      My unit test for the payment retry handler is failing. Fix it.
    should_trigger: false
    expected:
      - "Routes to the tests skill or performs test work directly."
      - "Does not bootstrap or rewrite repository documentation as a side effect."

  - id: do-not-handle-security-assessment
    prompt: >-
      Review our cryptographic inventory and post-quantum readiness.
    should_trigger: false
    expected:
      - "Routes to the security skill."
      - "Does not produce a generic README instead of the requested assessment."
