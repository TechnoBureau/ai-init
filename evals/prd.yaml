skill: prd
cases:
  - id: create-prd-from-code
    prompt: >-
      Write a PRD for this service based on what the code and workflows
      actually do.
    should_trigger: true
    expected:
      - "Uses exactly the ten required sections in order."
      - "Assigns permanent G-, D-, FR-, and NFR-IDs with acceptance criteria and verification methods."
      - "Cites repository evidence and marks unknowns Not documented or TBD."
    forbidden:
      - "Inventing users, numeric targets, or compliance obligations."
      - "Adding priority tiers."
      - "Claiming a requirement is implemented from README text alone."

  - id: refine-requirements-traceability
    prompt: >-
      Refine the existing PRD so each FR traces to a test or verification
      method, and do not renumber the IDs.
    should_trigger: true
    expected:
      - "Preserves existing IDs and records supersession instead of reuse."
      - "Adds a traceability table with Covered, Partial, or Gap status."
      - "States gaps honestly when no test exists."
    forbidden:
      - "Renumbering or recycling permanent IDs."
      - "Claiming coverage from a test name alone."

  - id: empty-repository-prd
    prompt: >-
      Create a PRD for this new empty repository. We have not decided the
      product yet.
    should_trigger: true
    expected:
      - "Keeps the ten-section structure and marks unknowns as Not decided."
      - "States that no goals, personas, or requirements are recorded."
      - "Does not assign filler IDs."
    forbidden:
      - "Inventing a product vision or personas to fill sections."

  - id: spec-first-feature
    prompt: >-
      We are adopting Spec-Driven Development. Create a feature specification
      for account recovery before implementation, covering scope, failure
      scenarios, authorization, privacy, acceptance criteria, and tests.
    should_trigger: true
    expected:
      - "Uses the existing requirement-ID scheme and links the feature to relevant PRD requirements."
      - "States in-scope behavior, non-goals, edge cases, security/privacy constraints, and observable acceptance criteria."
      - "Asks only about decisions that block a testable spec and does not implement code."
    forbidden:
      - "Treating the specification as proof that account recovery is implemented."
      - "Inventing policy, approvals, deadlines, or behavior not supported by the request."

  - id: risk-scaled-feature-spec
    prompt: >-
      We use Spec-Driven Development. Before implementation, specify this local
      CLI formatter change: an unsupported option displays “Unknown option; run
      --help for valid options.” Define a relevant acceptance criterion; do not
      implement it. The CLI has no network service or database.
    should_trigger: true
    expected:
      - "Uses a short, testable spec with the relevant behavior, input boundary, and acceptance criterion."
      - "Uses plain language and states a question only if repository evidence cannot establish the behavior."
      - "Omits unrelated API, database, deployment, and compliance sections."
    forbidden:
      - "Forcing a generic 15-section report or full threat-model package onto the small change."
      - "Inventing authentication, infrastructure, or regulatory requirements."

  - id: route-security-work
    prompt: >-
      Document our security controls and FIPS posture.
    should_trigger: false
    expected:
      - "Routes to the security skill."
      - "Does not substitute a PRD for a security assessment."
