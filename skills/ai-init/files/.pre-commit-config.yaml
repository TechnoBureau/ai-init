# Starter pre-commit configuration. Copy it only when the repository has no
# equivalent, then remove hooks for tools the project does not use.
#
# Pinning policy: every remote hook uses an exact version tag. A tag is a
# mutable reference, so review the release before merging a Dependabot update.
repos:
  # =============================================================================
  # Repository hygiene
  # =============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: fix-byte-order-marker
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
  # =============================================================================
  # Secret scanning
  # =============================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # IBM detect-secrets fork. Copy .secrets.baseline from this skill before
  # enabling; the baseline disables keyword scanning and records the same
  # exclude policy as the hook below.
  - repo: https://github.com/IBM/detect-secrets
    rev: 0.13.1+ibm.64.dss
    hooks:
      - id: detect-secrets
        description: Detect and prevent accidental secret commits.
        additional_dependencies:
          - boxsdk<4
          - chardet<7
        args:
          - --baseline
          - .secrets.baseline
          - --use-all-plugins
          - --no-keyword-scan
          - --fail-on-unaudited
        exclude: '(^|/)(requirements[^/]*\.txt|go\.mod|go\.sum|pom\.xml|build\.gradle(\.kts)?|package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb|Cargo\.lock|poetry\.lock|Pipfile\.lock|Gemfile\.lock|composer\.lock|\.secrets\.baseline)$|(^|/)(node_modules|vendor|third_party|dist|build|\.venv|venv|__pycache__)/|\.(min\.js|min\.css|map|lock|sum|snap|drawio)$'
  # =============================================================================
  # Optional Markdown consistency check for projects that use Node.js.
  # Uncomment before enabling.
  # =============================================================================
  # - repo: https://github.com/DavidAnson/markdownlint-cli2
  #   rev: v0.23.3
  #   hooks:
  #     - id: markdownlint-cli2
  # =============================================================================
  # Add project-specific hooks here and document any required tool versions.
  # Do not add a Markdown formatter that rewrites YAML frontmatter as prose.
  # =============================================================================
